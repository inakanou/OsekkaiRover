# おせっかいローバーの設定の見本。
# 実際の設定は ~/.config/osekkai/config.yaml（$XDG_CONFIG_HOME/osekkai/config.yaml）に置く。
# ファイルがなければ、起動のときにこの見本から作られる。
# 書いていない項目は既定値になる。名前や pin など個人の値は、この見本には書かない。

# 基盤の設定
core:
  # 起動を声で知らせる時間帯（始め、終わり）。時刻は引用符で囲む
  startup_voice_hours: ["08:00", "20:00"]

  # 声（Open JTalk）
  voice:
    open_jtalk: open_jtalk
    dictionary: /var/lib/mecab/dic/open-jtalk/naist-jdic
    htsvoice: ~/.local/share/osekkai/voices/tohoku-f01-happy.htsvoice
    pitch: 3.0     # 高さ（-24〜24）
    speed: 1.05    # 速さ（0.5〜2.0）
    sink: ""       # 再生先。空なら既定の再生先

  # 動き
  motion:
    allow_drive_in_dance: false   # ダンスでタイヤを回すか
    pan_range: [-80.0, 80.0]      # 首の左右の範囲（度）
    tilt_range: [-30.0, 60.0]     # 首の上下の範囲（度）
    # 調整値（実機に合わせて直す。-20〜20 度）
    calibration:                  # 正面の調整値（度）。pan と tilt は SunFounder の picar-x.conf と符号が逆
      steering: 0.0
      pan: 0.0
      tilt: 0.0
      motor_direction: [1, 1]     # 左右のモーターの向き（1 か -1）

  # ハード
  hardware:
    lcd_address: 0x27             # LCD の I2C のアドレス（0x03〜0x77）
    extra_button_pin: null        # 足したボタンのピン（例: D0）。なければ null
    motor_driver: auto            # auto、pwm_dir、dual_pwm
    speaker_enable_pin: auto      # auto か、ピンの番号

  # キャッシュの合計の上限（MiB、10〜5000）
  cache_max_mb: 200

# 機能の設定は、機能の名前をトップレベルのキーにして書く。
# 項目は機能ごとに決まっている。enabled: false にすると、その機能は開始しない。
# greeting:
#   enabled: true

# 音声の入口（ボタンを押して話しかけると、言葉を機能に渡す）。くわしくは docs/voice.md
voice:
  enabled: true
  # マイクの名前（arecord -L で出る名前）。実機のマイクに合わせて直す
  mic_device: "plughw:CARD=U0x46d0x825,DEV=0"
  listen_seconds: 5.0         # 1 回の録音の長さ（秒、2〜15）
  model: base                 # 聞き取りのモデルの大きさ（base か small）
  # 聞ける時間帯（始め、終わり）。時刻は引用符で囲む。外の時間は「ねる じかん」と答える
  hours: ["07:00", "21:30"]
  follow_up_seconds: 30.0     # 続けて聞くの待ちの長さ（秒、5〜120）
  # 聞き取りの選び方: auto、whisper（実機の聞き取り）、typed（端末で打った文字）。
  # 実機では whisper にする（auto だと faster-whisper がないときに打った文字になり、self-check で気づけない）
  recognizer: auto
  max_gain: 20.0              # 小さい声を持ち上げる倍率の上限（1〜50）

# 見つけてあいさつ（首のカメラで顔を見つけて追い、覚えた顔にあいさつする）。
# 書き方と顔の覚え方は docs/presence.md を見る。下の値は既定値。
# 子どもの呼び名は、ここではなく顔を覚えるコマンドで指定する。
presence:
  enabled: true
  greet_hours: ["07:00", "20:30"]   # あいさつする時間帯（始め、終わり）。時刻は引用符で囲む
  away_minutes: 20                  # この分だけ見えなかったら、またあいさつする（1〜600）
  okaeri_minutes: 120               # この分だけ見えなかったら「おかえり」（away_minutes〜1440）
  morning_end: "11:00"              # この時刻より前なら朝のあいさつ
  match_threshold: 0.38             # 覚えた顔と似ているかのしきい値（0〜1。大きいほど厳しい）
  pan_reverse: false                # 首の左右の動きを反転する
  tilt_reverse: false               # 首の上下の動きを反転する
  gaze_reverse: false               # 待機画面の目の向きを反転する
  flip: false                       # 映像の上下（180 度）を反転する

# おしゃべり（どの言葉にも当てはまらない言葉に、Claude で短い返事をする）。
# 鍵の置き方・送るもの・費用の目安は docs/conversation.md を見る。下の値は既定値。
conversation:
  enabled: true
  call_name: ""                     # 子どもの呼び名。外には送らない。空なら「きみ」
  call_name_variants: []            # 聞き取りが書く呼び名の別の形（例: 漢字）
  hours: ["07:00", "21:30"]         # 話せる時間帯（始め、終わり）。時刻は引用符で囲む
  daily_limit: 60                   # 1 日に話す返事の数の上限（1〜500）
  max_turns: 10                     # 1 つの会話で覚える往復の数（1〜30）
  reply_timeout_seconds: 20.0       # 返事を待つ長さ（秒、5〜60）

# だるまさんがころんだ（ロボットが鬼の遊び）。「だるまさん しよう」と話しかけると始まる。
# 見つけてあいさつのカメラを使うので、presence が無効なら遊べない。
# 遊び方としきい値の合わせ方は docs/daruma.md を見る。下の値は既定値。
daruma:
  enabled: true
  call_name: ""                     # 子どもの呼び名。外には送らない。空なら「きみ」
  threshold: 0.01                   # 動きの量がこれより大きいと「動いた」（0 より大きく 1 より小さい）
  watch_seconds: 2.5                # 振り向いてから見る長さ（秒、1〜10）
  max_rounds: 10                    # この回数のうちにタッチできたら子どもの勝ち。できなければローバーの勝ち（1〜50）
  end_before_task_min: 10           # 日課の次のタスクの何分前から遊ばないか（分、0〜120）

# ラジコン（家のスマホやタブレットの画面から車を動かす）。使い方は docs/remote.md を見る。
# 使うときは enabled: true にして、pin を足す。pin は実機の設定ファイルだけに書き、
# 引用符で囲んだ 4〜8 けたの数字にする。この見本には書かない。下の値は既定値。
remote:
  enabled: false
  port: 8080                        # 待ち受けるポート（1024〜65535）
  hours: ["07:00", "20:00"]         # 使える時間帯（始め、終わり）。時刻は引用符で囲む
  speed_slow: 20                    # 「ゆっくり」の速さ（1〜100）
  speed_fast: 35                    # 「はやい」の速さ（ゆっくり以上、100 まで）
  stop_cm: 20.0                     # 前の物がこれより近いと止まる（cm、5〜100）
  cliff_stop: true                  # 床の段差で止まるか
  cliff_reference: 500              # 床の値がこれ以下なら段差（0〜4095）
  back_max_seconds: 2.0             # 後退を続けられる長さ（秒、0.5〜10）
  photo_days: 30                    # 写真を残す日数（1〜365）
  usb_camera: ""                    # USB カメラの道（/dev/...）。空なら C270 を自動で探す

# 日課（決まった時刻の声かけ）。書き方は docs/routine.md を見る。
