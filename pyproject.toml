[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osekkai-rover"
version = "0.1.0"
description = "PiCar-X で子どもに寄り添うロボットの基盤"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6",
    "pydantic>=2,<3",
    # 日課の祝日の判定（features/routine/calendar.py の中だけで、遅れて読み込む）
    "jpholiday>=1.0.2,<2",
]

[project.optional-dependencies]
# 実機だけ。Pi では lgpio と numpy は apt（python3-lgpio、python3-numpy）で入れる
pi = [
    "smbus2",
    "lgpio",
    "numpy",
]
# 実機の音声の入口（聞き取り）だけ。開発 PC と CI には入れない
voice = [
    "faster-whisper>=1.1,<2",
    "ctranslate2>=4.4,<5",
]
# 実機のおしゃべり（Claude API）だけ。開発 PC と CI には入れない
conversation = [
    "anthropic>=2.6,<3",
]
# ラジコンの端末向けの画面（features/remote/web.py の中だけで読む）
remote = [
    "flask>=3.1,<3.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

# 機能を発見するエントリーポイントの群。機能を足したら、ここに 1 行足して入れ直す
# （.venv/bin/pip install -e '.[dev,remote]'）
[project.entry-points."osekkai.features"]
conversation = "osekkai.features.conversation:ConversationFeature"
daruma = "osekkai.features.daruma:DarumaFeature"
remote = "osekkai.features.remote:RemoteFeature"
routine = "osekkai.features.routine:RoutineFeature"
presence = "osekkai.features.presence:PresenceFeature"
voice = "osekkai.voice:VoiceGatewayFeature"

[tool.setuptools.packages.find]
where = ["src"]

# 設定の見本（config/osekkai.example.yaml と同じ内容）を同梱する
[tool.setuptools.package-data]
"osekkai.core" = ["example_config.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "deploy", "tests"]
# 仕様書と skill の Markdown にある下書きのコードは整えない
extend-exclude = [".kiro", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["osekkai", "rover_deploy"]

[tool.mypy]
python_version = "3.11"
files = ["src/osekkai", "deploy", "tests"]
mypy_path = ["src", "deploy"]
# tests に __init__.py がないので、2 つ目の conftest は同じ名前のモジュールとして断られる。
# 偽の Runner の本体（tests/deploy/fake_runner.py）と日課の部品の本体
# （tests/features/routine/routine_fixtures.py）は型を見る
exclude = ["^tests/deploy/conftest\\.py$", "^tests/features/routine/conftest\\.py$"]
strict = true
warn_unreachable = true

# 実機の依存は型を見ない
[[tool.mypy.overrides]]
module = [
    "smbus2",
    "smbus2.*",
    "lgpio",
    "lgpio.*",
    "numpy",
    "numpy.*",
    "cv2",
    "cv2.*",
    "picamera2",
    "picamera2.*",
]
ignore_missing_imports = true

# 音声の入口の聞き取りの依存（extras の voice）は開発 PC と CI に入れないので、型を見ない
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2", "ctranslate2.*"]
ignore_missing_imports = true

# おしゃべりの依存（extras の conversation）は開発 PC と CI に入れないので、型を見ない
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 配置の道具（deploy/rover_deploy）は osekkai のパッケージの外にある
pythonpath = ["deploy"]
addopts = "-ra"
