name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required check for main. Keeps personal data and secrets out of this public repo.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans every commit in the PR
      - name: 禁止ファイルのチェック
        run: bash scripts/check-forbidden-files.sh
      - name: 秘密情報のチェック (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # lint・format・型・テスト。実機の依存は入れない
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,remote]'
      - name: lint
        run: ruff check .
      - name: format の確認
        run: ruff format --check .
      - name: 型の確認
        run: mypy
      - name: テスト
        run: pytest
